rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /shopCodes/{code} {
      allow read: if true;
      allow create: if request.resource.data.coins == 0
                    && request.resource.data.keys().hasOnly(['coins','createdAt']);
      allow update: if request.auth != null
                    && request.auth.uid == "ak0XWZXVWfSSn7joNIe9r38uBP42";
      allow update: if request.auth == null
                    && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['coins'])
                    && request.resource.data.coins < resource.data.coins;
      allow update: if request.auth == null
                    && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['pseudo', 'pseudoUpdatedAt'])
                    && request.resource.data.pseudo is string
                    && request.resource.data.pseudo.size() > 0
                    && request.resource.data.pseudo.size() <= 32;
      allow delete: if false;
      match /purchases/{purchaseId} {
        allow read: if request.auth != null
                    && request.auth.uid == "ak0XWZXVWfSSn7joNIe9r38uBP42";
        allow create: if request.resource.data.keys().hasOnly(['pseudo','items','total','createdAt','crate'])
                      && request.resource.data.total is number
                      && request.resource.data.total > 0;
        allow update: if false;
        allow delete: if false;
      }
    }

    match /crateConfigs/{crateId} {
      // Tout le monde peut lire les lots (nécessaire pour vip-shop.html)
      allow read: if true;

      // Seul ton compte admin peut écrire la config des caisses
      allow write: if request.auth != null
                   && request.auth.uid == "ak0XWZXVWfSSn7joNIe9r38uBP42";
    }
  }
}
